name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk out/pembelajar-anak.apk
          ls -lh out

      - name: Publish APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          name: Pembelajar Anak - APK terbaru
          body: |
            APK release terbangun otomatis dari commit ${{ github.sha }}.

            Cara pasang: unduh `pembelajar-anak.apk` di bawah, lalu jalankan
            `adb install -r pembelajar-anak.apk` atau buka file-nya di Android.

            Login email/password berfungsi. Login Google baru aktif setelah
            Android OAuth client (`com.haikalshahab.pembelajar` + SHA-1) dibuat
            dan `EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID` diisi saat build.
          files: out/pembelajar-anak.apk
          fail_on_unmatched_files: true
