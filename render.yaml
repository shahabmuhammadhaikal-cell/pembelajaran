# Blueprint Render untuk backend Express + Firestore.
# Buka dashboard Render -> New -> Blueprint, lalu tunjuk file ini.
#
# Frontend React di-build di Render dan disajikan backend ini juga (satu URL),
# jadi https://<service>.onrender.com/ langsung membuka aplikasi. Alternatif lain:
# GitHub Pages (lihat .github/workflows/deploy-pages.yml) atau Firebase Hosting.

services:
  - type: web
    name: pembelajaran-api
    runtime: node
    rootDir: server
    # Build backend + frontend: dist React disajikan oleh server yang sama.
    buildCommand: npm install && cd ../client && npm ci && npm run build
    startCommand: node index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: "0.0.0.0"
      # URL publik backend ini (setelah service pertama kali dibuat, isi sesuai domain Render)
      - key: API_BASE_URL
        value: ""
      # Origin frontend React (GitHub Pages), dipisah koma bila lebih dari satu
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        generateValue: true
      # --- Firebase Firestore (database sementara) ---
      # Tempel isi file service account JSON (satu baris) sebagai rahasia.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # --- Opsional: bantuan AI ---
      # ollama (default) atau openai untuk endpoint OpenAI-compatible.
      - key: AI_PROVIDER
        value: ""
      # Ollama publik/lokal, atau https://.../v1 untuk layanan hosted.
      - key: AI_BASE_URL
        value: ""
      - key: AI_MODEL
        value: "qwen2.5:3b"
      # Kunci layanan hosted (rahasia). Kosongkan untuk Ollama tanpa kunci.
      - key: AI_API_KEY
        sync: false
